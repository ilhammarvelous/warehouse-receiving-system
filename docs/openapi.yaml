openapi: 3.0.3

info:
  title: Warehouse Receiving System API
  version: 1.0.0
  description: |
    REST API for the Warehouse Receiving System.

    This contract is derived from `docs/prd.md` and `docs/database-design.md`.
    Requirement IDs (`FR-*`, `BR-*`, `US-*`) are referenced in operation descriptions so that
    implementation and tests can be traced back to the PRD.

    ## Conventions

    - **Base path:** `/api/v1`.
    - **Format:** JSON requests and responses. Clients must send `Accept: application/json`
      and, for requests with a body, `Content-Type: application/json`.
    - **Authentication:** Bearer token (Laravel Sanctum). Obtain one from `POST /auth/login`
      and send it as `Authorization: Bearer <token>`. Every endpoint except `POST /auth/login`
      and `GET /health` requires it (FR-AUTH-4).
    - **Authorization:** Roles are `OPERATOR` and `SUPERVISOR`. Each operation lists its allowed
      roles in `x-allowed-roles`. The backend enforces this on every request (FR-AUTH-5, BR-24).
    - **Single resource response:** `{ "data": { ... } }`.
    - **List response:** `{ "data": [ ... ], "meta": { "page", "per_page", "total", "last_page" } }`.
    - **Pagination:** `page` (default 1) and `per_page` (default 20, maximum 100).
    - **Timestamps:** ISO 8601 in UTC, for example `2026-10-29T08:30:00Z` (NFR-16).
    - **IDs:** positive integers. A path id that does not match an existing resource returns `404`.
    - **Errors:** one JSON shape for every error (see the `Error` schema), with a stable
      machine-readable `error.code` (NFR-11).

    ## Status code summary

    | Status | Meaning |
    |---|---|
    | 200 / 201 / 204 | Success |
    | 401 | Missing, invalid or expired token; wrong login credentials |
    | 403 | Authenticated but the role is not permitted |
    | 404 | Resource does not exist |
    | 409 | Valid request that conflicts with the current state |
    | 422 | Input validation failure or business-rule violation on the submitted values |
    | 500 | Unexpected error, no internal details exposed |
    | 503 | Health check only: database unreachable |

servers:
  - url: http://localhost:8000/api/v1
    description: Local development (Docker Compose)

tags:
  - name: Health
    description: Readiness check for deployment tools
  - name: Auth
    description: Login, logout and current user
  - name: Products
    description: Product master data
  - name: Receiving Documents
    description: Inbound delivery documents and their lifecycle
  - name: Receipts
    description: Recording received quantities
  - name: Inventory
    description: Current stock and stock transaction history

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Health
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health and readiness check
      description: |
        Reports whether the application is running and whether the database is reachable
        (FR-OPS-1, US-16). Suitable as a container health check. Does not require authentication
        and does not use the standard error envelope.
      security: []
      x-allowed-roles: [PUBLIC]
      responses:
        '200':
          description: Application and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
                database: ok
        '503':
          description: Application is running but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: error
                database: unreachable

  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and obtain an access token
      description: FR-AUTH-1, US-01.
      security: []
      x-allowed-roles: [PUBLIC]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: supervisor@example.com
              password: password
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Invalid email or password.
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out and revoke the current token
      description: FR-AUTH-2, US-01 AC4. The token used for this request is invalidated.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      responses:
        '204':
          description: Logged out. No content.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      description: FR-AUTH-3.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # -------------------------------------------------------------- Products
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: |
        Paginated list, ordered by SKU ascending. `search` matches SKU or name
        (case-insensitive, contains). FR-PROD-3, US-03.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      description: |
        Creates a product and, in the same transaction, its inventory row with stock 0.
        The SKU is trimmed and converted to uppercase before validation and storage.
        FR-PROD-1, FR-PROD-2, FR-PROD-5, BR-01, US-02.
      x-allowed-roles: [SUPERVISOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              sku: abc-001
              name: Mineral Water 600 ml
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
              example:
                data:
                  id: 12
                  sku: ABC-001
                  name: Mineral Water 600 ml
                  created_at: '2026-10-29T08:30:00Z'
                  updated_at: '2026-10-29T08:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Validation failed (`VALIDATION_ERROR`) or the SKU already exists in any letter case
            (`SKU_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  summary: Invalid fields
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The given data was invalid.
                      details:
                        fields:
                          sku: [The sku format is invalid.]
                          name: [The name field is required.]
                duplicateSku:
                  summary: SKU already exists
                  value:
                    error:
                      code: SKU_ALREADY_EXISTS
                      message: A product with this SKU already exists.
                      details:
                        fields:
                          sku: [The sku has already been taken.]

  /products/{productId}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get one product
      description: FR-PROD-4.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------- Receiving documents
  /receiving-documents:
    get:
      tags: [Receiving Documents]
      operationId: listReceivingDocuments
      summary: List receiving documents
      description: |
        Paginated list, newest first. `status` filters by exact status. `search` matches
        document number or supplier name (case-insensitive, contains).
        FR-DOC-8, US-06.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          required: false
          description: Filter by document status.
          schema:
            $ref: '#/components/schemas/DocumentStatus'
      responses:
        '200':
          description: A page of receiving documents.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReceivingDocumentSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

    post:
      tags: [Receiving Documents]
      operationId: createReceivingDocument
      summary: Create a receiving document
      description: |
        Creates a document in status `DRAFT` with an auto-generated number
        (`RCV-YYYYMMDD-NNNN`) and its items. FR-DOC-1 to FR-DOC-5, BR-02, BR-04, BR-19, US-04.
      x-allowed-roles: [SUPERVISOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivingDocumentRequest'
            example:
              supplier_name: PT Sumber Makmur
              expected_date: '2026-11-02'
              notes: Morning delivery, dock 2
              items:
                - product_id: 12
                  expected_quantity: 100
                - product_id: 15
                  expected_quantity: 40
      responses:
        '201':
          description: Document created in status `DRAFT`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReceivingDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/DocumentValidationError'

  /receiving-documents/{documentId}:
    get:
      tags: [Receiving Documents]
      operationId: getReceivingDocument
      summary: Get a receiving document with items and receipt history
      description: FR-DOC-9, FR-DOC-10, US-07.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document with its items and receipts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReceivingDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Receiving Documents]
      operationId: updateReceivingDocument
      summary: Replace the header and items of a draft document
      description: |
        Replaces the header fields and the complete item list. Items omitted from the request
        are removed. Allowed only while the document is `DRAFT`. FR-DOC-6, FR-DOC-7, BR-05, US-05.
      x-allowed-roles: [SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceivingDocumentRequest'
      responses:
        '200':
          description: Document updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReceivingDocumentDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The document is not in `DRAFT`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DOCUMENT_NOT_EDITABLE
                  message: Only documents in DRAFT status can be edited.
                  details:
                    status: OPEN
        '422':
          $ref: '#/components/responses/DocumentValidationError'

  /receiving-documents/{documentId}/confirm:
    post:
      tags: [Receiving Documents]
      operationId: confirmReceivingDocument
      summary: Confirm a draft document (DRAFT to OPEN)
      description: |
        FR-LIFE-1, BR-04, US-08. A draft always has at least one item (creation and update
        require it), so this transition fails only because of the current status.
        Takes no request body.
      x-allowed-roles: [SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentTransitioned'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStatusTransition'

  /receiving-documents/{documentId}/complete:
    post:
      tags: [Receiving Documents]
      operationId: completeReceivingDocument
      summary: Complete a fully received document (PARTIALLY_RECEIVED to COMPLETED)
      description: |
        FR-LIFE-3, BR-08, BR-09, US-12. Allowed only when every item has
        `received_quantity = expected_quantity`. Takes no request body.
      x-allowed-roles: [SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentTransitioned'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The transition is not allowed from the current status (`INVALID_STATUS_TRANSITION`),
            or at least one item is not fully received (`DOCUMENT_NOT_FULLY_RECEIVED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidTransition:
                  summary: Document is DRAFT, OPEN, COMPLETED or CANCELLED
                  value:
                    error:
                      code: INVALID_STATUS_TRANSITION
                      message: A document in status OPEN cannot be completed.
                      details:
                        from: OPEN
                        action: complete
                notFullyReceived:
                  summary: Some items still have remaining quantity
                  value:
                    error:
                      code: DOCUMENT_NOT_FULLY_RECEIVED
                      message: All items must be fully received before the document can be completed.
                      details:
                        incomplete_items:
                          - item_id: 31
                            remaining_quantity: 6

  /receiving-documents/{documentId}/cancel:
    post:
      tags: [Receiving Documents]
      operationId: cancelReceivingDocument
      summary: Cancel a document (DRAFT or OPEN to CANCELLED)
      description: |
        FR-LIFE-4, BR-11, US-13. A document with any receipt (`PARTIALLY_RECEIVED`)
        cannot be cancelled. Takes no request body.
      x-allowed-roles: [SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentTransitioned'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The document has receipts (`DOCUMENT_HAS_RECEIPTS`, status `PARTIALLY_RECEIVED`),
            or it is already final or otherwise not cancellable (`INVALID_STATUS_TRANSITION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hasReceipts:
                  value:
                    error:
                      code: DOCUMENT_HAS_RECEIPTS
                      message: A document that already has receipts cannot be cancelled.
                      details:
                        status: PARTIALLY_RECEIVED
                invalidTransition:
                  value:
                    error:
                      code: INVALID_STATUS_TRANSITION
                      message: A document in status COMPLETED cannot be cancelled.
                      details:
                        from: COMPLETED
                        action: cancel

  # --------------------------------------------------------------- Receipts
  /receiving-documents/{documentId}/items/{itemId}/receipts:
    post:
      tags: [Receipts]
      operationId: recordReceipt
      summary: Record a received quantity for one item
      description: |
        The main receiving operation. In one database transaction it increases the item's
        received quantity, increases the product's stock on hand, appends an inventory
        transaction, records the receipt, and moves the document from `OPEN` to
        `PARTIALLY_RECEIVED` when this is its first receipt. If any step fails nothing is
        applied (FR-RCV-5, BR-13, BR-14).

        Processing order (see `docs/database-design.md`, section 6.3):
        lock document, idempotency lookup, status check, lock item, remaining-quantity check,
        write.

        **Idempotency (FR-RCV-6, BR-15, US-10).** The `Idempotency-Key` header is required.
        The request content that is compared is the document id, item id and `quantity`.
        - Same key and same content: the original response is returned with status 201 and the
          header `Idempotent-Replayed: true`. Stock does not change.
        - Same key and different content: `409 IDEMPOTENCY_KEY_REUSED`.
        - Only successful results are stored. A rejected request can be corrected and sent again
          with a new key.

        Requirements: FR-RCV-1 to FR-RCV-8, BR-06, BR-07, US-09, US-11.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptRequest'
            example:
              quantity: 4
      responses:
        '201':
          description: Receipt recorded (or replayed from an earlier identical request).
          headers:
            Idempotent-Replayed:
              description: Present with value `true` when this response is a replay of an earlier request with the same key.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReceiptResult'
              example:
                data:
                  receipt:
                    id: 88
                    item_id: 31
                    quantity: 4
                    received_by:
                      id: 2
                      name: Operator One
                    created_at: '2026-11-02T03:15:00Z'
                  item:
                    id: 31
                    product:
                      id: 12
                      sku: ABC-001
                      name: Mineral Water 600 ml
                    expected_quantity: 10
                    received_quantity: 4
                    remaining_quantity: 6
                  document:
                    id: 7
                    document_number: RCV-20261102-0001
                    status: PARTIALLY_RECEIVED
                    all_items_received: false
                  inventory:
                    product_id: 12
                    quantity_on_hand: 34
                  transaction:
                    id: 205
                    type: RECEIVE
                    quantity: 4
                    balance_after: 34
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The document does not exist, or the item does not belong to the document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: Receiving item not found in this document.
        '409':
          description: |
            The document cannot receive goods in its current status (`DOCUMENT_NOT_RECEIVABLE`),
            or the idempotency key was already used with different content (`IDEMPOTENCY_KEY_REUSED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notReceivable:
                  value:
                    error:
                      code: DOCUMENT_NOT_RECEIVABLE
                      message: Goods can only be received on documents in OPEN or PARTIALLY_RECEIVED status.
                      details:
                        status: COMPLETED
                keyReused:
                  value:
                    error:
                      code: IDEMPOTENCY_KEY_REUSED
                      message: This Idempotency-Key was already used with a different request.
        '422':
          description: |
            Validation failed (`VALIDATION_ERROR`, including a missing or malformed
            `Idempotency-Key` header or an invalid `quantity`), or the quantity is greater than
            the remaining quantity of the item (`QUANTITY_EXCEEDS_REMAINING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                exceedsRemaining:
                  value:
                    error:
                      code: QUANTITY_EXCEEDS_REMAINING
                      message: Received quantity exceeds the remaining expected quantity.
                      details:
                        remaining_quantity: 6
                        requested_quantity: 7
                missingKey:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The given data was invalid.
                      details:
                        fields:
                          Idempotency-Key: [The Idempotency-Key header is required.]
                invalidQuantity:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The given data was invalid.
                      details:
                        fields:
                          quantity: [The quantity must be an integer of at least 1.]

  # -------------------------------------------------------------- Inventory
  /inventory:
    get:
      tags: [Inventory]
      operationId: listInventory
      summary: List current stock per product
      description: |
        Paginated list ordered by SKU ascending. `search` matches SKU or name. Products that were
        never received have `quantity_on_hand` 0. FR-INV-1, US-14.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: A page of inventory rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /inventory-transactions:
    get:
      tags: [Inventory]
      operationId: listInventoryTransactions
      summary: List inventory transaction history
      description: |
        Read-only, newest first. There is no endpoint to create, edit or delete a transaction;
        they are written only as a side effect of recording a receipt (FR-INV-5, BR-16).
        FR-INV-4, US-15.
      x-allowed-roles: [OPERATOR, SUPERVISOR]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: product_id
          in: query
          required: false
          description: Only transactions of this product.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: receiving_document_id
          in: query
          required: false
          description: Only transactions caused by this receiving document.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: A page of inventory transactions.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryTransaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token from `POST /auth/login`.

  # ------------------------------------------------------------ Parameters
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      required: false
      description: Free-text search, case-insensitive, matches as "contains". Maximum 100 characters.
      schema:
        type: string
        maxLength: 100
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique value for this receipt attempt (a UUID is recommended).
        Reuse the same value only when retrying the same attempt. Scoped to the user and endpoint.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 7d5f0c2e-3b6a-4c1e-9a77-1d2b8e5f4a10

  # ------------------------------------------------------------- Responses
  responses:
    Unauthenticated:
      description: Missing, invalid, expired or revoked token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Authentication is required.
    Forbidden:
      description: The authenticated user's role is not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Your role is not allowed to perform this action.
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found.
    ValidationError:
      description: Input validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: The given data was invalid.
              details:
                fields:
                  per_page: [The per page must not be greater than 100.]
    DocumentValidationError:
      description: |
        Validation failed (`VALIDATION_ERROR`), or the same product appears more than once
        (`DUPLICATE_PRODUCT_IN_DOCUMENT`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Invalid fields
              value:
                error:
                  code: VALIDATION_ERROR
                  message: The given data was invalid.
                  details:
                    fields:
                      items: [The items field must have at least 1 items.]
                      expected_date: [The expected date is not a valid date.]
            duplicateProduct:
              summary: Same product twice
              value:
                error:
                  code: DUPLICATE_PRODUCT_IN_DOCUMENT
                  message: A product can appear only once in a receiving document.
                  details:
                    product_ids: [12]
    InvalidStatusTransition:
      description: The action is not allowed from the document's current status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_STATUS_TRANSITION
              message: A document in status OPEN cannot be confirmed.
              details:
                from: OPEN
                action: confirm
    DocumentTransitioned:
      description: The document after the status change.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ReceivingDocumentDetail'

  # --------------------------------------------------------------- Schemas
  schemas:
    # ---- common
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable message. Not a stable contract; use `code` in code.
            details:
              type: object
              additionalProperties: true
              description: |
                Optional structured context. For validation errors it contains
                `fields`, a map from field name to a list of messages.
      example:
        error:
          code: QUANTITY_EXCEEDS_REMAINING
          message: Received quantity exceeds the remaining expected quantity.
          details:
            remaining_quantity: 6
            requested_quantity: 7

    ErrorCode:
      type: string
      description: Stable machine-readable error code (PRD section 8.5).
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_ERROR
        - SKU_ALREADY_EXISTS
        - DUPLICATE_PRODUCT_IN_DOCUMENT
        - QUANTITY_EXCEEDS_REMAINING
        - DOCUMENT_NOT_EDITABLE
        - DOCUMENT_NOT_RECEIVABLE
        - DOCUMENT_NOT_FULLY_RECEIVED
        - DOCUMENT_HAS_RECEIPTS
        - INVALID_STATUS_TRANSITION
        - IDEMPOTENCY_KEY_REUSED
        - INTERNAL_ERROR

    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
      example:
        page: 1
        per_page: 20
        total: 45
        last_page: 3

    HealthStatus:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [ok, unreachable]

    UserRef:
      type: object
      description: Minimal user reference used in audit fields.
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    ProductRef:
      type: object
      description: Minimal product reference embedded in other resources.
      required: [id, sku, name]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string

    # ---- auth
    Role:
      type: string
      enum: [OPERATOR, SUPERVISOR]

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
      example:
        id: 1
        name: Supervisor One
        email: supervisor@example.com
        role: SUPERVISOR

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResult:
      type: object
      required: [token, token_type, user]
      properties:
        token:
          type: string
          description: 'Opaque bearer token. Send as `Authorization: Bearer <token>`.'
        token_type:
          type: string
          enum: [Bearer]
        user:
          $ref: '#/components/schemas/User'

    # ---- products
    Product:
      type: object
      required: [id, sku, name, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
          description: Uppercase SKU.
          pattern: '^[A-Z0-9]([A-Z0-9-]*[A-Z0-9])?$'
          maxLength: 50
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required: [sku, name]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$'
          description: |
            Letters, digits and hyphen; must not start or end with a hyphen. Trimmed and converted
            to uppercase by the server. Unique, compared case-insensitively (BR-01).
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed by the server. Must not be blank.

    # ---- receiving documents
    DocumentStatus:
      type: string
      enum: [DRAFT, OPEN, PARTIALLY_RECEIVED, COMPLETED, CANCELLED]

    ReceivingItemRequest:
      type: object
      required: [product_id, expected_quantity]
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
          description: Must reference an existing product. Unique within the document (BR-02).
        expected_quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000

    ReceivingDocumentRequest:
      type: object
      required: [supplier_name, expected_date, items]
      properties:
        supplier_name:
          type: string
          minLength: 1
          maxLength: 255
        expected_date:
          type: string
          format: date
          description: May be in the past or the future.
        notes:
          type: string
          maxLength: 1000
          nullable: true
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReceivingItemRequest'

    ReceivingDocumentSummary:
      type: object
      required:
        - id
        - document_number
        - supplier_name
        - expected_date
        - status
        - item_count
        - total_expected_quantity
        - total_received_quantity
        - created_at
      properties:
        id:
          type: integer
          format: int64
        document_number:
          type: string
          pattern: '^RCV-[0-9]{8}-[0-9]{4,}$'
          example: RCV-20261102-0001
        supplier_name:
          type: string
        expected_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DocumentStatus'
        item_count:
          type: integer
          minimum: 0
        total_expected_quantity:
          type: integer
          format: int64
        total_received_quantity:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    ReceivingItem:
      type: object
      required: [id, product, expected_quantity, received_quantity, remaining_quantity]
      properties:
        id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/ProductRef'
        expected_quantity:
          type: integer
          format: int32
        received_quantity:
          type: integer
          format: int32
        remaining_quantity:
          type: integer
          format: int32
          description: '`expected_quantity - received_quantity`.'

    Receipt:
      type: object
      required: [id, item_id, quantity, received_by, created_at]
      properties:
        id:
          type: integer
          format: int64
        item_id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          minimum: 1
        received_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          type: string
          format: date-time

    ReceivingDocumentDetail:
      allOf:
        - $ref: '#/components/schemas/ReceivingDocumentSummary'
        - type: object
          required:
            - notes
            - all_items_received
            - created_by
            - status_changed_by
            - status_changed_at
            - items
            - receipts
          properties:
            notes:
              type: string
              nullable: true
            all_items_received:
              type: boolean
              description: |
                True when every item is fully received. A document in `PARTIALLY_RECEIVED` with this
                flag set is ready to be completed by a Supervisor; the UI shows "Ready to complete".
            created_by:
              $ref: '#/components/schemas/UserRef'
            status_changed_by:
              allOf:
                - $ref: '#/components/schemas/UserRef'
              nullable: true
            status_changed_at:
              type: string
              format: date-time
              nullable: true
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReceivingItem'
            receipts:
              type: array
              description: Receipt history of the whole document, newest first.
              items:
                $ref: '#/components/schemas/Receipt'

    # ---- receipts
    ReceiptRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: |
            Quantity received now. Must not exceed the item's remaining quantity (BR-07).
            Zero, negative and non-integer values are rejected.

    ReceiptResult:
      type: object
      required: [receipt, item, document, inventory, transaction]
      properties:
        receipt:
          $ref: '#/components/schemas/Receipt'
        item:
          $ref: '#/components/schemas/ReceivingItem'
        document:
          type: object
          required: [id, document_number, status, all_items_received]
          properties:
            id:
              type: integer
              format: int64
            document_number:
              type: string
            status:
              $ref: '#/components/schemas/DocumentStatus'
            all_items_received:
              type: boolean
        inventory:
          type: object
          required: [product_id, quantity_on_hand]
          properties:
            product_id:
              type: integer
              format: int64
            quantity_on_hand:
              type: integer
              format: int64
        transaction:
          type: object
          required: [id, type, quantity, balance_after]
          properties:
            id:
              type: integer
              format: int64
            type:
              type: string
              enum: [RECEIVE]
            quantity:
              type: integer
              format: int32
            balance_after:
              type: integer
              format: int64

    # ---- inventory
    InventoryItem:
      type: object
      required: [product_id, sku, name, quantity_on_hand, updated_at]
      properties:
        product_id:
          type: integer
          format: int64
        sku:
          type: string
        name:
          type: string
        quantity_on_hand:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time

    InventoryTransaction:
      type: object
      required:
        - id
        - type
        - quantity
        - balance_after
        - product
        - receiving_document
        - receiving_item_id
        - receipt_id
        - created_by
        - created_at
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [RECEIVE]
        quantity:
          type: integer
          format: int32
          minimum: 1
        balance_after:
          type: integer
          format: int64
          description: Stock on hand of the product immediately after this transaction.
        product:
          $ref: '#/components/schemas/ProductRef'
        receiving_document:
          type: object
          required: [id, document_number]
          properties:
            id:
              type: integer
              format: int64
            document_number:
              type: string
        receiving_item_id:
          type: integer
          format: int64
        receipt_id:
          type: integer
          format: int64
        created_by:
          $ref: '#/components/schemas/UserRef'
        created_at:
          type: string
          format: date-time
